    "name": "Finite-comb and finite-hole classification for relatively separated carriers",
    "description": "Let Λ be a locally finite subset of the real line with a uniform bound on the number of points in each integer unit cell. The whole complex Meyer space of tempered distributions T with value-only atomic physical and Fourier records on Λ has finite dimension. Its dimension equals the attained maximum of nullities over finite unions L of translated positive-step full lattices for which L ∖ Λ is finite. For each L, the original physical and Fourier coefficients must both vanish at every missing site. In finite lattice residue coordinates, subtracting the joint rank of these rows from the sum of the cyclotomic block nullities gives the envelope nullity. One such envelope realizes the whole space. With separate relatively separated carriers both members of the Fourier pair are finite sums of translated and modulated lattice Dirac combs. The separately stated one-record H6 theorem only bounds the physical carrier. The active spectral module is finitely generated, and a single nonzero exponential polynomial with frequencies in that module annihilates every member of the fixed-carrier space.",
