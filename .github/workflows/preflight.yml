name: Palomar mechanical preflight
on: workflow_dispatch
permissions:
  contents: read
jobs:
  wholespace:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: wholespace01
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"WholeSpace/comparator.json","formalization_metadata_path":"WholeSpace/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
  lowerray:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: lowerray0001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"LowerRay/comparator.json","formalization_metadata_path":"LowerRay/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
