    "name": "Annihilation and finite-comb classification from finite lower density on one ray",
    "description": "Let T be a tempered distribution on the real line with value-only atomic records for T and its Fourier transform on locally finite carriers. If the point count on either ray of the physical carrier is bounded by C times the radius along arbitrarily large radii, a nonzero finite real-frequency exponential polynomial annihilates T. The opposite carrier only needs to be locally finite for this implication. When the counted carrier is the actual support and the centred count of the opposite carrier has zero quadratic lower density, both records are finite sums of translated and modulated lattice Dirac combs. The latter conclusion also holds with the Fourier record as the counted actual support. The radii witnessing lower density may be sparse.",
