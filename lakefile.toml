name = "MeyerFourierPairs"
version = "0.1.0"
defaultTargets = ["WholeSpace", "LowerRay"]

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "b133ddab71aaffc60efffbf344ceca878c954f14"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "d870b9068518a0870842d15a0cd42637ec30b587"

[[lean_lib]]
name = "MeyerGeneralProblem"

[[lean_lib]]
name = "WholeSpace"
roots = ["WholeSpace.Challenge", "WholeSpace.Solution"]

[[lean_lib]]
name = "LowerRay"
roots = ["LowerRay.Challenge", "LowerRay.Solution"]
